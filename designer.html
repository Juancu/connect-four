<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>connectTag — daily puzzle</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141311;
      --ink: #f6f1e7;
      --muted: #b7b0a4;
      --gold: #f0c14b;
      --panel: #221f1b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: rgba(20, 19, 17, 0.94);
      border-bottom: 1px solid #3c3832;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .toolbar p {
      margin: 2px 0 0;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button.primary {
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: var(--gold);
      color: #1c160b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      margin: 0;
      color: var(--gold);
      font-weight: 650;
    }

    #status:empty { display: none; }

    main { padding: 8px 0 48px; }

    .category { margin: 0 0 18px; }

    .category-head {
      display: flex;
      gap: 12px;
      align-items: baseline;
      padding: 0 22px 8px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .category-head span {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .carousel {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 22px 10px;
    }

    .shot {
      flex: 0 0 auto;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
      cursor: pointer;
    }

    .shot img {
      display: block;
      height: 148px;
      width: auto;
      aspect-ratio: 571 / 460;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .shot[aria-pressed="true"] { border-color: var(--gold); }

    .empty { padding: 24px 22px; color: var(--muted); }

    #json-out {
      display: block;
      width: min(900px, calc(100% - 44px));
      height: 220px;
      margin: 8px 22px 24px;
      font: 12px/1.45 Consolas, ui-monospace, monospace;
    }

    #json-out[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Daily puzzle</h1>
      <p>Click 4 pictures in each category you want. Export copies the selection.</p>
    </div>
    <div class="actions">
      <span id="summary"></span>
      <button type="button" id="export" class="primary">Export</button>
    </div>
  </div>
  <p id="status" role="status"></p>
  <main>
    <div id="categories"></div>
    <textarea id="json-out" hidden readonly></textarea>
  </main>

,"7672c502-567b-43bb-97f2-685f95e7ff88","a714fdfe-4363-45af-841d-3e605dd46865","5e7dc993-b7dc-41df-80bb-5636d47f91e0","d20055f8-c0d2-4ab5-be0a-147308d3f4f4","91dc37c8-2f07-46a1-9472-64276edb4130","7160d15a-de3d-4fbc-8420-36cebee84806","a1c915a4-6736-4d68-a6e4-6d594f98adf2","419314d1-8bf2-4209-9bde-28a9a80772c2","232665a5-cc5d-49a4-abd2-eb37074ec3fb","3790be9e-b3c9-486e-a2ed-a7313bd97018","9604e111-0ed5-4000-b3dd-af7529a3e880","fda17a67-c940-405a-8e48-93d6dbd4a286","65f8020e-8536-4dbf-a6f7-fde907932ff3","dae2e5a1-54be-4a42-901b-81a9a9816be9","92136833-85d8-407c-9fae-59df7757f672","ed59e168-ba53-4995-9ef2-358d12c94924","523a47b7-2bdc-4b4a-a066-1079412f5632","43e2ad90-c78a-47b0-8535-4b6cba949cfd","4528aa09-42d0-4a3f-8ac6-98c129a14be5","1899f163-ede5-47ee-a7ed-58b8c8a3cd1e","1ed3c41f-9faa-4af2-869e-f693403bf5d9","2d1efa92-9e78-446e-b600-f761e5efd6ce"]}]</script>
  <script>
const TAGS = JSON.parse(document.getElementById("designer-data").textContent);
const MAX_PER_TAG = 4;

const categories = document.querySelector("#categories");
const exportButton = document.querySelector("#export");
const status = document.querySelector("#status");
const jsonOut = document.querySelector("#json-out");
const summary = document.querySelector("#summary");

const picks = {};
try {
  localStorage.removeItem("connecttag.dailyPicks");
} catch {
  // Nothing stored to clear.
}

function selectedIds(slug) {
  const ids = picks[slug];
  return Array.isArray(ids) ? ids.filter((id) => typeof id === "string") : [];
}

function render() {
  categories.replaceChildren();
  if (TAGS.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Pictures are still downloading. Reload this page in a little while.";
    categories.append(empty);
    updateSummary();
    return;
  }

  for (const tag of TAGS) {
    const chosen = new Set(selectedIds(tag.slug).filter((id) => tag.images.includes(id)));
    picks[tag.slug] = [...chosen];

    const section = document.createElement("section");
    section.className = "category";
    section.dataset.slug = tag.slug;

    const header = document.createElement("div");
    header.className = "category-head";
    const title = document.createElement("h2");
    title.textContent = tag.name;
    const count = document.createElement("span");
    count.textContent = `${chosen.size}/${MAX_PER_TAG}`;
    header.append(title, count);

    const row = document.createElement("div");
    row.className = "carousel";
    for (const id of tag.images) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "shot";
      button.dataset.id = id;
      button.setAttribute("aria-pressed", String(chosen.has(id)));
      const image = document.createElement("img");
      image.src = `data/art/${id}.jpg`;
      image.alt = "";
      image.draggable = false;
      image.loading = "lazy";
      button.append(image);
      button.addEventListener("click", () => toggle(tag.slug, id));
      row.append(button);
    }

    section.append(header, row);
    categories.append(section);
  }
  updateSummary();
}

function toggle(slug, id) {
  const tag = TAGS.find((item) => item.slug === slug);
  const current = selectedIds(slug).filter((item) => tag.images.includes(item));
  const index = current.indexOf(id);
  if (index >= 0) current.splice(index, 1);
  else if (current.length < MAX_PER_TAG) current.push(id);
  picks[slug] = current;
  const section = categories.querySelector(`section[data-slug="${CSS.escape(slug)}"]`);
  if (!section) {
    render();
    return;
  }
  section.querySelector(".category-head span").textContent = `${current.length}/${MAX_PER_TAG}`;
  for (const button of section.querySelectorAll(".shot")) {
    button.setAttribute("aria-pressed", String(current.includes(button.dataset.id)));
  }
  updateSummary();
}

function readyGroups() {
  return TAGS
    .map((tag) => ({
      slug: tag.slug,
      name: tag.name,
      images: selectedIds(tag.slug).filter((id) => tag.images.includes(id)),
    }))
    .filter((group) => group.images.length === MAX_PER_TAG);
}

function updateSummary() {
  const ready = readyGroups().length;
  summary.textContent = `${ready} ${ready === 1 ? "category" : "categories"} with 4 pictures`;
  exportButton.disabled = ready === 0;
}

function setStatus(message) {
  status.textContent = message;
}

async function copyJson() {
  const groups = readyGroups();
  if (groups.length === 0) {
    setStatus("Pick 4 pictures in a category first.");
    return;
  }
  const text = JSON.stringify(groups, null, 2);
  jsonOut.hidden = true;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      setStatus(`Copied ${groups.length} ${groups.length === 1 ? "category" : "categories"}.`);
      return;
    }
  } catch {
    // file:// pages often block the clipboard API.
  }
  jsonOut.hidden = false;
  jsonOut.value = text;
  jsonOut.focus();
  jsonOut.select();
  const copied = document.execCommand("copy");
  setStatus(copied
    ? `Copied ${groups.length} ${groups.length === 1 ? "category" : "categories"}.`
    : "Clipboard was blocked. The JSON is selected below — press Ctrl+C.");
}

exportButton.addEventListener("click", () => {
  copyJson();
});

render();

  </script>
