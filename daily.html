<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>connectTag daily</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141311;
      --ink: #f6f1e7;
      --muted: #b7b0a4;
      --tile: #2c2823;
      --line: #3c3832;
      --gold: #f0c14b;
      --red: #e15b5b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
    }

    main {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: -0.03em;
      text-align: center;
    }

    .intro {
      margin: 0 0 18px;
      color: var(--muted);
      text-align: center;
    }

    #message {
      min-height: 1.4em;
      margin: 0 0 12px;
      text-align: center;
      font-weight: 650;
    }

    #solved {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    #solved:empty { margin: 0; }

    .solved-row {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      overflow: hidden;
      border-radius: 12px;
      background: #221f1b;
    }

    .solved-row img {
      display: block;
      width: 100%;
      aspect-ratio: 571 / 460;
      object-fit: contain;
    }

    .solved-row strong {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: rgba(12, 10, 8, 0.62);
      color: white;
      font-size: clamp(20px, 4vw, 32px);
      letter-spacing: -0.02em;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tile-wrap { position: relative; }

    .tile {
      display: block;
      width: 100%;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      background: var(--tile);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }

    .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 571 / 460;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .tile[aria-pressed="true"] { border-color: var(--gold); }

    .tile.is-wrong { border-color: var(--red); }

    .loupe {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(20, 19, 17, 0.82);
      color: white;
      display: grid;
      place-items: center;
      cursor: zoom-in;
      opacity: 0;
      pointer-events: none;
    }

    .tile-wrap.is-loupe .loupe {
      opacity: 1;
      pointer-events: auto;
    }

    #zoom {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(8, 7, 6, 0.92);
      cursor: zoom-out;
    }

    #zoom[hidden] { display: none; }

    #zoom img {
      max-width: min(1100px, 100%);
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .zoom-prev,
    .zoom-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 76px;
      border: 0;
      border-radius: 12px;
      background: rgba(20, 19, 17, 0.78);
      color: white;
      font: 40px/1 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }

    .zoom-prev { left: 12px; }
    .zoom-next { right: 12px; }

    .mistakes {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin: 16px 0 12px;
      color: var(--muted);
    }

    .dots { display: flex; gap: 8px; }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #6f6a62;
    }

    .dot.is-wrong { background: var(--red); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .actions button {
      min-width: 128px;
      height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #221f1b;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    #submit:not(:disabled) {
      border-color: var(--gold);
      background: var(--gold);
      color: #1c160b;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Daily</h1>
    <p class="intro">Today’s puzzle. Select four, then submit.</p>
    <p id="message" role="status"></p>
    <div id="board">
      <div id="solved"></div>
      <div id="grid"></div>
    </div>
    <div class="mistakes">
      <span>Mistakes remaining</span>
      <span class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </div>
    <div class="actions">
      <button type="button" id="shuffle">Shuffle</button>
      <button type="button" id="deselect">Deselect all</button>
      <button type="button" id="submit" disabled>Submit</button>
    </div>
    <footer>Random puzzle: puzzle.html</footer>
  </main>
  <div id="zoom" hidden>
    <button type="button" class="zoom-prev" aria-label="Previous picture">‹</button>
    <img alt="">
    <button type="button" class="zoom-next" aria-label="Next picture">›</button>
  </div>
  <script id="puzzle-data" type="application/json">{"groups":[{"id":"bandage","name":"Bandage","cards":[{"id":"34f64ecd-d1d1-4aa6-be8e-e97d38134cf2","src":"data/art/34f64ecd-d1d1-4aa6-be8e-e97d38134cf2.jpg"},{"id":"050b6bb2-8b63-435b-85de-2ad39bda5cad","src":"data/art/050b6bb2-8b63-435b-85de-2ad39bda5cad.jpg"},{"id":"f006f92b-f011-48ff-b32d-272638f277b7","src":"data/art/f006f92b-f011-48ff-b32d-272638f277b7.jpg"},{"id":"29ef36ba-de5d-4a76-8113-9444e0c7c844","src":"data/art/29ef36ba-de5d-4a76-8113-9444e0c7c844.jpg"}]},{"id":"bare-buttock","name":"Bare Buttock","cards":[{"id":"d4c5357f-7a07-4e8b-a0e9-1c82cb620bd8","src":"data/art/d4c5357f-7a07-4e8b-a0e9-1c82cb620bd8.jpg"},{"id":"e87a70b0-4485-4362-9a1d-7c320cd7755e","src":"data/art/e87a70b0-4485-4362-9a1d-7c320cd7755e.jpg"},{"id":"898f22f3-e0d1-4adf-b760-423109d3ff35","src":"data/art/898f22f3-e0d1-4adf-b760-423109d3ff35.jpg"},{"id":"2553e5a3-06d7-4a3a-ae94-adbc253e3164","src":"data/art/2553e5a3-06d7-4a3a-ae94-adbc253e3164.jpg"}]},{"id":"bell","name":"Bell","cards":[{"id":"e4d32fec-8d96-4311-bec5-d7e40f7e2705","src":"data/art/e4d32fec-8d96-4311-bec5-d7e40f7e2705.jpg"},{"id":"9541af44-ea5a-485c-9c14-c9235bf743fd","src":"data/art/9541af44-ea5a-485c-9c14-c9235bf743fd.jpg"},{"id":"fe700ba7-e270-428b-a2e3-320ece27923b","src":"data/art/fe700ba7-e270-428b-a2e3-320ece27923b.jpg"},{"id":"5448800e-42a3-48f6-911c-4c91d81fc212","src":"data/art/5448800e-42a3-48f6-911c-4c91d81fc212.jpg"}]},{"id":"chicken","name":"Chicken","cards":[{"id":"1e758745-bac3-45c7-a889-eeb0849fae84","src":"data/art/1e758745-bac3-45c7-a889-eeb0849fae84.jpg"},{"id":"fbb7112a-1782-41cc-877e-9c9aa8754dc4","src":"data/art/fbb7112a-1782-41cc-877e-9c9aa8754dc4.jpg"},{"id":"6def1c73-f22a-46e6-b4a4-6245bbe2b440","src":"data/art/6def1c73-f22a-46e6-b4a4-6245bbe2b440.jpg"},{"id":"8866f60d-460b-4619-a099-850008167179","src":"data/art/8866f60d-460b-4619-a099-850008167179.jpg"}]}]}</script>
  <script>
const puzzle = JSON.parse(document.getElementById("puzzle-data").textContent);

const board = document.querySelector("#board");
const solvedRows = document.querySelector("#solved");
const grid = document.querySelector("#grid");
const dots = [...document.querySelectorAll(".dot")];
const message = document.querySelector("#message");
const shuffleButton = document.querySelector("#shuffle");
const deselectButton = document.querySelector("#deselect");
const submitButton = document.querySelector("#submit");

const cards = new Map();
for (const group of puzzle.groups) {
  for (const card of group.cards) {
    cards.set(card.id, { ...card, groupId: group.id });
  }
}

let unsolved = shuffle([...cards.keys()]);
const selected = new Set();
const solved = [];
let mistakes = 0;
let ended = false;
let busy = false;
let wrongIds = new Set();

function shuffle(list) {
  const copy = [...list];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const swap = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swap]] = [copy[swap], copy[index]];
  }
  return copy;
}

function groupById(id) {
  return puzzle.groups.find((group) => group.id === id);
}

function selectedGroup() {
  if (selected.size !== 4) return null;
  return puzzle.groups.find((group) => group.cards.every((card) => selected.has(card.id))) ?? null;
}

function render() {
  solvedRows.replaceChildren();
  const shown = [...solved];
  if (ended && ended !== "won") {
    for (const group of puzzle.groups) {
      if (!shown.includes(group.id)) shown.push(group.id);
    }
  }
  for (const groupId of shown) {
    const group = groupById(groupId);
    const row = document.createElement("div");
    row.className = "solved-row";
    for (const card of group.cards) row.append(picture(card.src));
    const title = document.createElement("strong");
    title.textContent = group.name;
    row.append(title);
    solvedRows.append(row);
  }

  grid.replaceChildren();
  if (ended) {
    grid.hidden = true;
  } else {
    grid.hidden = false;
    clearLoupeTimer();
    for (const id of unsolved) {
      const card = cards.get(id);
      const wrap = document.createElement("div");
      wrap.className = "tile-wrap";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tile";
      if (wrongIds.has(id)) button.classList.add("is-wrong");
      button.setAttribute("aria-pressed", String(selected.has(id)));
      button.append(picture(card.src));
      button.addEventListener("click", () => {
        if (suppressClick) {
          suppressClick = false;
          return;
        }
        toggle(id);
      });
      button.addEventListener("contextmenu", (event) => event.preventDefault());
      button.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" || ended || busy) return;
        const startX = event.clientX;
        const startY = event.clientY;
        const hold = setTimeout(() => {
          suppressClick = true;
          openZoom(id);
        }, 500);
        const cancelHold = (move) => {
          if (move?.type === "pointermove" && Math.hypot(move.clientX - startX, move.clientY - startY) < 12) return;
          clearTimeout(hold);
          button.removeEventListener("pointermove", cancelHold);
          button.removeEventListener("pointerup", cancelHold);
          button.removeEventListener("pointercancel", cancelHold);
        };
        button.addEventListener("pointermove", cancelHold);
        button.addEventListener("pointerup", cancelHold);
        button.addEventListener("pointercancel", cancelHold);
      });
      wrap.append(button, loupeButton(id));
      wrap.addEventListener("pointerenter", () => {
        clearLoupeTimer();
        loupeTimer = setTimeout(() => wrap.classList.add("is-loupe"), 1000);
      });
      wrap.addEventListener("pointerleave", () => {
        clearLoupeTimer();
        wrap.classList.remove("is-loupe");
      });
      grid.append(wrap);
    }
  }

  dots.forEach((dot, index) => {
    dot.classList.toggle("is-wrong", index < Math.min(mistakes, dots.length));
  });

  if (ended === "won") message.textContent = "You found all four groups.";
  else if (ended === "lost") message.textContent = "Five mistakes. The groups are shown above.";
  else if (wrongIds.size) message.textContent = "That isn’t one of the groups.";
  else message.textContent = "";

  shuffleButton.disabled = ended || unsolved.length < 2;
  deselectButton.disabled = ended || selected.size === 0;
  submitButton.disabled = ended || busy || selected.size !== 4;
}

const zoom = document.querySelector("#zoom");
const zoomImage = zoom.querySelector("img");
let loupeTimer = null;
let suppressClick = false;
let zoomIds = [];
let zoomIndex = 0;
let zoomSwipe = null;

function clearLoupeTimer() {
  clearTimeout(loupeTimer);
  loupeTimer = null;
}

function showZoom() {
  if (!zoomIds.length) {
    closeZoom();
    return;
  }
  zoomIndex = (zoomIndex + zoomIds.length) % zoomIds.length;
  zoomImage.src = cards.get(zoomIds[zoomIndex]).src;
  zoom.hidden = false;
}

function openZoom(id) {
  clearLoupeTimer();
  zoomIds = [...unsolved];
  zoomIndex = Math.max(0, zoomIds.indexOf(id));
  showZoom();
}

function stepZoom(delta) {
  zoomIndex += delta;
  showZoom();
}

function closeZoom() {
  zoom.hidden = true;
  zoomImage.removeAttribute("src");
  zoomIds = [];
  zoomSwipe = null;
}

zoom.addEventListener("pointerdown", (event) => {
  if (event.target.closest(".zoom-prev, .zoom-next")) return;
  zoomSwipe = { x: event.clientX, y: event.clientY };
});

zoom.addEventListener("pointerup", (event) => {
  if (event.target.closest(".zoom-prev, .zoom-next") || !zoomSwipe) return;
  const dx = event.clientX - zoomSwipe.x;
  const dy = event.clientY - zoomSwipe.y;
  zoomSwipe = null;
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) {
    stepZoom(dx < 0 ? 1 : -1);
    return;
  }
  closeZoom();
});

document.querySelector(".zoom-prev").addEventListener("click", (event) => {
  event.stopPropagation();
  stepZoom(-1);
});
document.querySelector(".zoom-next").addEventListener("click", (event) => {
  event.stopPropagation();
  stepZoom(1);
});

document.addEventListener("keydown", (event) => {
  if (zoom.hidden) return;
  if (event.key === "Escape") closeZoom();
  if (event.key === "ArrowLeft") stepZoom(-1);
  if (event.key === "ArrowRight") stepZoom(1);
});

function loupeButton(id) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "loupe";
  button.setAttribute("aria-label", "Zoom picture");
  button.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  button.addEventListener("click", (event) => {
    event.stopPropagation();
    openZoom(id);
  });
  return button;
}
function picture(src) {
  const image = document.createElement("img");
  image.src = src;
  image.alt = "";
  image.draggable = false;
  return image;
}

function toggle(id) {
  if (ended || busy) return;
  if (selected.has(id)) selected.delete(id);
  else if (selected.size < 4) selected.add(id);
  wrongIds = new Set();
  render();
}

shuffleButton.addEventListener("click", () => {
  if (ended || busy) return;
  unsolved = shuffle(unsolved);
  render();
});

deselectButton.addEventListener("click", () => {
  if (ended || busy) return;
  selected.clear();
  wrongIds = new Set();
  render();
});

submitButton.addEventListener("click", async () => {
  if (ended || busy || selected.size !== 4) return;
  const match = selectedGroup();
  if (match) {
    solved.push(match.id);
    unsolved = unsolved.filter((id) => !selected.has(id));
    selected.clear();
    wrongIds = new Set();
    if (solved.length === puzzle.groups.length) ended = "won";
    render();
    return;
  }

  busy = true;
  mistakes += 1;
  wrongIds = new Set(selected);
  render();
  if (mistakes >= 5) {
    ended = "lost";
    selected.clear();
    wrongIds = new Set();
    busy = false;
    render();
    return;
  }
  await new Promise((resolve) => setTimeout(resolve, 550));
  selected.clear();
  wrongIds = new Set();
  busy = false;
  render();
});

render();

  </script>
  
</body>
</html>
